name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # ForgeGradle downloads and decompiles Minecraft on a cold run, which takes several minutes.
      # Caching both the Gradle caches and ForgeGradle's own output turns that into seconds.
      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Check the generated resources are up to date
        run: |
          python3 tools/generate_resources.py --no-textures
          git diff --exit-code -- src/main/resources \
            || (echo "::error::Generated resources are stale - run tools/generate_resources.py and commit the result" && exit 1)

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: brama-jar
          path: build/libs/*.jar
          if-no-files-found: error
